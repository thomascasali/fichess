name: Bug Report
description: Report something in Fichess that isn't working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in **Fichess - Online Chess**.

        Please fill in as much detail as you can — it makes the issue much faster to reproduce and fix.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: >
        Open **Info & Support** — the heart icon at the top left of the lobby — and read
        the version at the very bottom of the screen.
      placeholder: "e.g. 2.2.1+83"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true

  - type: input
    id: device-os
    attributes:
      label: Device model and OS version
      description: For example the iPhone/Android model and the iOS/Android version installed.
      placeholder: "e.g. iPhone 14 Pro, iOS 17.5 / Samsung Galaxy S23, Android 14"
    validations:
      required: true

  - type: input
    id: fics-username
    attributes:
      label: FICS username (optional)
      description: >
        Optional, but it helps us look up the game/connection on the server to reproduce the issue.
        Do **not** include your password or any other credential here.
      placeholder: "e.g. Magico"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that lead to the bug, in order.
      placeholder: |
        1. Open the app and log in
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag and drop images or a video here if you have them — it really helps.
    validations:
      required: false

  - type: checkboxes
    id: no-credentials
    attributes:
      label: Confirmation
      options:
        - label: >
            I confirm I have NOT included my FICS password or any other credential anywhere in this
            report.
          required: true
